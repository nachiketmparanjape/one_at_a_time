<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#0f172a"/>

  <!-- Subtle card shape behind the checkmark -->
  <rect x="120" y="100" width="272" height="340" rx="24" fill="#1e293b"/>

  <!-- Swipe-right motion lines (left side) -->
  <line x1="80" y1="230" x2="115" y2="230" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <line x1="65" y1="270" x2="115" y2="270" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <line x1="80" y1="310" x2="115" y2="310" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

  <!-- Large checkmark — the core action -->
  <path d="M195 275 L240 320 L330 215" stroke="#22c55e" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small "1" badge top-right -->
  <circle cx="370" cy="130" r="44" fill="#3b82f6"/>
  <text x="370" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="52" font-weight="bold" fill="#fff">1</text>
</svg>
